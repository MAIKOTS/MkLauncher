# Project-wide Gradle settings.

# 🚀 1. MEMÓRIA E DESEMPENHO DA JVM
# Aumenta a memória heap para 1GB (ou 4GB) e ativa o coletor de lixo G1GC para build rápida
org.gradle.jvmargs=-Xmx1024m -XX:+UseG1GC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# ⚡ 2. ACELERAÇÃO DE COMPILAÇÃO
# Compila módulos independentes em paralelo
org.gradle.parallel=true

# Reutiliza tarefas já executadas entre compilações
org.gradle.caching=true

# Mantém o daemon do Gradle ativo na memória entre um build e outro
org.gradle.daemon=true

# 📦 3. CONFIGURAÇÕES DO ANDROID / ANDROIDX
# Garante suporte às bibliotecas modernas AndroidX
android.useAndroidX=true

# Ativa o R class não-transitivo para acelerar o tempo de build e reduzir o tamanho do APK
android.nonTransitiveRClass=true

# 🔤 4. ESTILO KOTLIN
# kotlin.code.style=official
